<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/view/">
  <title>Cellularena Viewer</title>
  <style>
    :root {
      --bg: #111319;
      --panel: #1c202a;
      --panel-alt: #252b38;
      --text: #e8edf6;
      --muted: #9ba6bc;
      --accent: #33adcc;
      --accent-2: #fd5901;
      --border: #30384a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 20% 10%, #1f2533 0%, var(--bg) 55%);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, sans-serif;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      grid-template-columns: 220px 1fr 260px;
    }

    .controls {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px;
      background: color-mix(in srgb, var(--panel) 92%, black 8%);
      border-bottom: 1px solid var(--border);
      align-items: center;
    }

    .controls input,
    .controls button,
    .controls select {
      background: var(--panel-alt);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 14px;
    }

    .controls button {
      cursor: pointer;
    }

    .controls button:hover {
      border-color: var(--accent);
    }

    .controls .wide {
      min-width: 340px;
      flex: 1;
    }

    .status {
      color: var(--muted);
      min-width: 200px;
    }

    .result-badge {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-weight: 700;
      font-size: 13px;
      white-space: nowrap;
    }

    .stage-wrap {
      grid-column: 2;
      grid-row: 2;
      display: grid;
      place-items: center;
      overflow: auto;
      padding: 10px;
      min-height: 0;
    }

    #stage {
      width: min(96vw, 1400px);
      aspect-ratio: 16 / 9;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.35);
      background: #000;
    }

    #stage canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    label {
      color: var(--muted);
      font-size: 13px;
    }

    /* ── Checkpoint replay sidebar ─────────────────────────────────── */
    #replay-panel {
      grid-column: 1;
      grid-row: 2;
      background: var(--panel);
      border-right: 1px solid var(--border);
      overflow: hidden;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 0;
    }
    .rp-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
    .rp-header button {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 0;
    }
    .rp-status { font-size: 11px; color: var(--muted); font-style: italic; }
    #rp-list { list-style: none; margin: 0; padding: 0 4px 0 0; display: flex; flex-direction: column; gap: 4px; flex: 1 1 auto; min-height: 0; overflow-y: auto; }
    .rp-item {
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      font-size: 11px;
      line-height: 1.4;
      background: var(--panel-alt);
      transition: border-color 0.15s;
    }
    .rp-item:hover { border-color: var(--accent); }
    .rp-item.active { border-color: var(--accent-2); background: color-mix(in srgb, var(--accent-2) 15%, var(--panel-alt)); }
    .rp-name { font-weight: 600; color: var(--text); word-break: break-all; }
    .rp-meta { color: var(--muted); margin-top: 2px; }
    .rp-new { display: inline-block; background: var(--accent); color: #fff; font-size: 9px; font-weight: 700; padding: 1px 4px; border-radius: 4px; margin-left: 4px; }

    /* action console */
    #action-console {
      grid-column: 3; grid-row: 2;
      background: var(--panel);
      border-left: 1px solid var(--border);
      overflow-y: auto; padding: 8px;
      display: flex; flex-direction: column; gap: 8px;
      min-height: 0;
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 12px;
    }
    .ac-header { font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
    .ac-turn { color: var(--muted); font-size: 11px; }
    .ac-player { margin-bottom: 6px; }
    .ac-player-name { font-weight: 700; font-size: 11px; margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* player 0 renders orange, player 1 renders blue (see ViewModule pIdx mapping) */
    .ac-player-name.p0 { color: #fd5901; }
    .ac-player-name.p1 { color: #33adcc; }
    .ac-cmd { background: var(--panel-alt); border-radius: 4px; padding: 4px 6px; word-break: break-all; white-space: pre-wrap; }
    .ac-wait { color: var(--muted); font-style: italic; }
    .ac-empty { color: var(--muted); font-style: italic; font-size: 11px; }
  </style>
</head>
<body>
  <div class="controls">
    <input id="replayPath" class="wide" type="text" value="../Games/cellularena/experiments/shared/replays/core_884960620.json" aria-label="Replay path">
    <button id="loadEngineBtn" type="button">Load Replay</button>
    <label>
      Replay file
      <input id="fileInput" type="file" accept=".json,application/json">
    </label>
    <button id="playPauseBtn" type="button">Play</button>
    <button id="prevBtn" type="button">Prev</button>
    <button id="nextBtn" type="button">Next</button>
    <label>
      Speed
      <select id="speedSel">
        <option value="0.5">0.5x</option>
        <option value="1" selected>1x</option>
        <option value="2">2x</option>
        <option value="4">4x</option>
      </select>
    </label>
    <label>
      Turn
      <input id="turnRange" type="range" min="0" max="0" value="0">
    </label>
    <span id="status" class="status">No replay loaded</span>
    <span id="resultBadge" class="result-badge" style="display:none"></span>
  </div>

  <div class="stage-wrap">
    <div id="stage"></div>
  </div>

  <aside id="replay-panel">
    <div class="rp-header">
      <span>Checkpoints</span>
      <button id="rpRefreshBtn" title="Refresh">&#x21BB;</button>
    </div>
    <select id="rp-experiment" aria-label="Experiment">
      <option value="">All experiments</option>
    </select>
    <div id="rp-status" class="rp-status">Loading…</div>
    <ul id="rp-list"></ul>
  </aside>

  <aside id="action-console">
    <div class="ac-header">Actions</div>
    <div id="ac-body" class="ac-empty">Load a replay and play to see actions</div>
  </aside>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/5.3.12/pixi.min.js"></script>
  <script src="./viewer.js"></script>
  <script type="module" src="./app.js"></script>
  <script>
    (function () {
      const body = document.getElementById('ac-body')
      window.addEventListener('acTurnChanged', function (e) {
        const fi = e.detail.frameIndex
        const total = e.detail.total
        const frames = window._acFrames || []
        const agents = window._acAgents || []
        const frame = frames[fi + 1]
        if (!frame) { body.innerHTML = '<span class="ac-empty">No frame data</span>'; return }
        const stdout = frame.stdout || []
        let html = '<div class="ac-turn">Turn ' + (fi + 1) + ' / ' + total + '</div>'
        for (let i = 0; i < 2; i++) {
          const name = (agents[i] || {}).name || ('Player ' + i)
          const cmd = (stdout[i] || '').trim() || 'WAIT'
          const cls = i === 0 ? 'p0' : 'p1'
          const isWait = cmd === 'WAIT'
          html += '<div class="ac-player"><div class="ac-player-name ' + cls + '">' + name + '</div>'
                + '<div class="ac-cmd' + (isWait ? ' ac-wait' : '') + '">' + cmd + '</div></div>'
        }
        body.innerHTML = html
      })
    })()
  </script>
</body>
</html>
