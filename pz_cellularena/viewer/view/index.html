<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cellularena Viewer</title>
  <style>
    :root {
      --bg: #111319;
      --panel: #1c202a;
      --panel-alt: #252b38;
      --text: #e8edf6;
      --muted: #9ba6bc;
      --accent: #33adcc;
      --accent-2: #fd5901;
      --border: #30384a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 20% 10%, #1f2533 0%, var(--bg) 55%);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, sans-serif;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px;
      background: color-mix(in srgb, var(--panel) 92%, black 8%);
      border-bottom: 1px solid var(--border);
      align-items: center;
    }

    .controls input,
    .controls button,
    .controls select {
      background: var(--panel-alt);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 14px;
    }

    .controls button {
      cursor: pointer;
    }

    .controls button:hover {
      border-color: var(--accent);
    }

    .controls .wide {
      min-width: 340px;
      flex: 1;
    }

    .status {
      color: var(--muted);
      min-width: 200px;
    }

    .stage-wrap {
      display: grid;
      place-items: center;
      overflow: auto;
      padding: 10px;
    }

    #stage {
      width: min(96vw, 1400px);
      aspect-ratio: 16 / 9;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.35);
      background: #000;
    }

    #stage canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    label {
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="controls">
    <input id="replayPath" class="wide" type="text" value="../../replays/core_884960630.json" aria-label="Replay path">
    <button id="loadEngineBtn" type="button">Load Replay</button>
    <label>
      Replay file
      <input id="fileInput" type="file" accept=".json,application/json">
    </label>
    <button id="playPauseBtn" type="button">Play</button>
    <button id="prevBtn" type="button">Prev</button>
    <button id="nextBtn" type="button">Next</button>
    <label>
      Speed
      <select id="speedSel">
        <option value="0.5">0.5x</option>
        <option value="1" selected>1x</option>
        <option value="2">2x</option>
        <option value="4">4x</option>
      </select>
    </label>
    <label>
      Turn
      <input id="turnRange" type="range" min="0" max="0" value="0">
    </label>
    <span id="status" class="status">No replay loaded</span>
  </div>

  <div class="stage-wrap">
    <div id="stage"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/5.3.12/pixi.min.js"></script>
  <script src="./viewer.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
